apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
  project: roboshop
  environment: dev
spec:
  # selector uses below labels to select the pod
  selector:
    project: roboshop
    environment: dev
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
  project: roboshop
  environment: dev
  component: frontend
  tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx
    envFrom:
    - secretRef:
       name: nginxsecret

